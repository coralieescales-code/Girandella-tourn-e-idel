    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse 78% 38% at 8% -4%, rgba(15, 101, 214, .30), transparent 68%),
      radial-gradient(ellipse 68% 34% at 101% 7%, rgba(0, 189, 176, .26), transparent 66%),
      radial-gradient(ellipse 78% 42% at -18% 48%, rgba(15, 145, 198, .17), transparent 70%),
      radial-gradient(ellipse 70% 38% at 112% 62%, rgba(30, 193, 130, .20), transparent 68%),
      radial-gradient(ellipse 82% 42% at 18% 104%, rgba(31, 105, 196, .19), transparent 70%),
      linear-gradient(165deg, #E8F2FA 0%, #DDF2F0 42%, #E5F3EE 72%, #E4EDF8 100%);
    background-attachment: fixed;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .36;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,.76) 0 1px, transparent 1.6px),
      radial-gradient(circle at 75% 35%, rgba(255,255,255,.58) 0 1px, transparent 1.5px);
    background-size: 34px 34px, 46px 46px;
    mask-image: linear-gradient(to bottom, rgba(0,0,0,.65), transparent 72%);
  }
  button, input, textarea, select { -webkit-appearance: none; appearance: none; }
  input[type=checkbox] { -webkit-appearance: auto; appearance: auto; accent-color: #0C8F7A; }
  .tap {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .10s ease, box-shadow .18s ease, filter .18s ease, background .18s ease;
  }
  .tap:hover { filter: brightness(1.015); }
  .tap:active { transform: scale(.975); }
  button:disabled { opacity: .32; }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: #168ECA !important;
    box-shadow: 0 0 0 4px rgba(17,115,201,.11) !important;
  }
  ::placeholder { color: #93A4AA; opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .tap { transition: none; } }
