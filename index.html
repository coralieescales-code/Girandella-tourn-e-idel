 liens vers les textes complets n\xE9cessitent internet."}),(0,o.jsxs)("div",{style:c.card,children:[(0,o.jsx)("label",{style:c.emailLabel,children:"\u{1F9EE} Aide-m\xE9moire cotation (int\xE9gr\xE9, hors ligne)"}),(0,o.jsx)("div",{style:c.docText,children:`Lettre-cl\xE9 AMI : 3,15 \u20AC (avenant 11 : 3,35 \u20AC d\xE9but novembre 2026, puis 3,45 \u20AC au 1er novembre 2027).
Depuis le 21 juin 2026 (d\xE9cision UNCAM du 2 juin 2026) : pansement de plaie non chirurgicale AMI 2,02 ; pansement de plaie chirurgicale simple AMI 2,02 (remplacent l'\xAB autre pansement \xBB AMI 2) ; administration et surveillance de la prise m\xE9dicamenteuse \xE0 domicile AMI 1,2 (troubles neurologiques, psychiatriques, cognitifs, sensoriels ou moteurs ; accord pr\xE9alable au-del\xE0 du 1er mois) ; MIE inscrite \xE0 l'art. 23.5 ; lettre AIS supprim\xE9e (BSA/BSB/BSC depuis 2024) ; ordonnance \xAB jusqu'\xE0 cicatrisation \xBB accept\xE9e 3 mois maximum.
Cumul (art. 11B NGAP) : 1er acte \xE0 100 %, 2e \xE0 50 % de son coefficient, suivants non factur\xE9s (hors exceptions pr\xE9vues).
MAU (+1,35 \u20AC) : passage avec un seul acte de coefficient \u2264 1,5.
MCI (+5 \u20AC) : pansements lourds et complexes du titre XVI et soins palliatifs \u2014 jamais pour une ablation de fils/agrafes ni un pansement courant.
MIE (+3,15 \u20AC) : enfant de moins de 7 ans.
Majorations horaires : nuit 20h-23h / 5h-8h +9,15 \u20AC ; nuit 23h-5h +18,30 \u20AC ; dimanche et f\xE9ri\xE9 +8,50 \u20AC (nuit et dimanche ne se cumulent pas entre elles).
D\xE9placement : IFD 2,75 \u20AC par passage \xE0 domicile.
IK : plaine 0,35 \u20AC/km (abattement 4 km A/R) ; montagne 0,50 \u20AC/km (abattement 2 km A/R) ; conditions : hors m\xEAme agglom\xE9ration, plafond 299 km/jour.
Forfaits BSI : BSA 13 \u20AC / BSB 18,20 \u20AC / BSC 28,70 \u20AC par jour.
Ablation de fils ou agrafes : \u2264 10 \u2192 AMI 2 ; > 10 \u2192 AMI 4.
Valeurs v\xE9rifi\xE9es le 20 ao\xFBt 2026 (ameli.fr, L\xE9gifrance) \u2014 la NGAP publi\xE9e par l'Assurance Maladie fait foi.`})]}),(0,o.jsxs)("div",{style:c.card,children:[(0,o.jsx)("label",{style:c.emailLabel,children:"\u{1F48A} Ce que l'infirmier(\xE8re) peut prescrire (r\xE9sum\xE9, hors ligne)"}),(0,o.jsx)("div",{style:c.docText,children:`Prescription infirmi\xE8re \u2014 arr\xEAt\xE9 du 26 juin 2026 (NOR SFHH2617311A), en application de la loi infirmi\xE8re du 27 juin 2025. Liste FERM\xC9E : ce qui y figure est autoris\xE9 aux conditions pos\xE9es, ce qui n'y figure pas ne l'est pas.

1. VACCINATION
Prescription et administration des vaccins du calendrier vaccinal pour les personnes de 11 ans et plus, covid-19 d\xE8s 5 ans, grippe saisonni\xE8re.
\u26A0 CONDITIONS : d\xE9claration pr\xE9alable OBLIGATOIRE aupr\xE8s de l'Ordre des infirmiers, et ATTESTATION DE FORMATION requise \u2014 sauf si l'on ne prescrit que grippe et covid-19 (dispense, annexe I de l'arr\xEAt\xE9). Exclusion : vaccins vivants att\xE9nu\xE9s chez les personnes immunod\xE9prim\xE9es.

2. PR\xC9VENTION ET TRAITEMENT DES PLAIES
\u2022 Supports d'aide \xE0 la pr\xE9vention et au traitement des escarres : matelas, sur-matelas, coussins, cales.
\u2022 Pansements : compresses, sets, pansements techniques (hydrocellulaires, hydrocollo\xEFdes, hydrogels, alginates, interfaces, \xE0 base de charbon, d'argent\u2026), sparadraps, bandes.
\u2022 Antiseptiques locaux et s\xE9rum physiologique.
\u2022 Bas et articles de compression/contention veineuse (renouvellement \xE0 l'identique de la force de compression).
\u26A0 LIMITES : pansements prescrits pour une dur\xE9e initiale de 7 jours. Exclusions imposant une orientation m\xE9dicale : pied diab\xE9tique complexe, plaies oncologiques non cicatris\xE9es, br\xFBlures du tr\xE8s jeune enfant, plaies balistiques ou du visage. C\xF4t\xE9 facturation lib\xE9rale, l'acc\xE8s direct sans ordonnance pour les plaies ne sera remboursable qu'\xE0 partir du 1er janvier 2027 (convention en cours d'alignement).

3. SANT\xC9 SEXUELLE ET REPRODUCTIVE
\u2022 Renouvellement des contraceptifs oraux : uniquement un contraceptif prescrit depuis moins d'un an, pour 6 mois maximum, non renouvelable \u2014 avec sur l'ordonnance initiale : nom, pr\xE9nom, num\xE9ro d'enregistrement, mention \xAB Renouvellement infirmier \xBB, dur\xE9e et date.
\u2022 Contraception d'urgence.
\u2022 Prescription des tests de d\xE9pistage des IST.

4. SEVRAGE TABAGIQUE
Substituts nicotiniques (patchs, gommes, pastilles\u2026).

5. PRODUITS DE SANT\xC9 COURANTS
\u2022 Antalgiques de palier I (parac\xE9tamol\u2026) dans le champ de comp\xE9tences.
\u2022 S\xE9rum physiologique.
\u2022 Mat\xE9riel de pr\xE9vention et dispositifs m\xE9dicaux : cerceaux de lit ; location de b\xE9quilles et cannes ; soul\xE8ve-malade m\xE9canique ou \xE9lectrique ; dispositifs pour l'incontinence et l'appareil uro-g\xE9nital (\xE9tui p\xE9nien, joints et raccords, plat bassin et urinal, poches, filtres, tampons, supports, ceintures, clamps, p\xE2te p\xE9ristomiale, tampons absorbants, bouchons, collecteurs) ; dispositifs pour colostomis\xE9s pratiquant l'irrigation ; n\xE9cessaires pour irrigation colique ; sondes v\xE9sicales pour autosondage et h\xE9t\xE9rosondage (et leur renouvellement) ; mat\xE9riel de perfusion \xE0 domicile ; autosurveillance glyc\xE9mique et mat\xE9riel d'injection d'insuline (renouvellement).

6. EXAMENS BIOLOGIQUES
NFS, ionogramme, cr\xE9atinin\xE9mie, glyc\xE9mie, HbA1c, INR (suivi AVK), ECBU.

CONDITIONS COMMUNES
\u2022 Prescription dans le champ de comp\xE9tences infirmier, en coh\xE9rence avec la situation clinique, sans se substituer au diagnostic m\xE9dical.
\u2022 Tra\xE7abilit\xE9 OBLIGATOIRE : toute prescription est inscrite au dossier patient ou au DMP.
\u2022 Renouvellement \xE0 l'identique : le pharmacien doit pouvoir consulter la prescription initiale.
\u2022 Les ANTIBIOTIQUES ne sont PAS prescriptibles (liste ferm\xE9e).
\u2022 Ces comp\xE9tences engagent ta responsabilit\xE9 : la formation continue est fortement recommand\xE9e avant de les exercer (plaies, vaccination, biologie), et l'information du m\xE9decin traitant est pr\xE9vue pour la coordination.
\u2022 Cet arr\xEAt\xE9 remplace les anciens textes (arr\xEAt\xE9 vaccins de 2023 et arr\xEAt\xE9 dispositifs de 2012, abrog\xE9s).

Le texte int\xE9gral fait foi \u2014 lien L\xE9gifrance ci-dessous.`})]}),(0,o.jsxs)("div",{style:c.card,children:[(0,o.jsx)("label",{style:c.emailLabel,children:"\u{1F4CB} Avenant 6 \u2014 le BSI en pratique (int\xE9gr\xE9, hors ligne)"}),(0,o.jsx)("div",{style:c.sectionHint,children:"Touche un titre pour ouvrir la partie."}),[{ic:"\u{1F9ED}",t:"Le principe du BSI",x:`L'avenant 6 \xE0 la convention nationale (conclu le 29 mars 2019 entre l'UNCAM, la FNI et le Sniil) instaure le Bilan de Soins Infirmiers (BSI), qui remplace la D\xE9marche de Soins Infirmiers (DSI) pour la prise en charge des patients d\xE9pendants.

Le m\xE9decin prescrit une prise en charge de la d\xE9pendance ; l'infirmier r\xE9alise \xE0 domicile une \xE9valuation clinique globale : \xE9tat de sant\xE9, environnement, entourage, besoins en soins d'hygi\xE8ne, mobilisation, alimentation, \xE9limination, surveillance, soins relationnels et \xE9ducatifs.

R\xE9sultat : au lieu de coter chaque s\xE9ance de soins (ex-AIS \xE0 la demi-heure), un FORFAIT JOURNALIER couvre l'ensemble des soins de d\xE9pendance de la journ\xE9e, quel que soit le nombre de passages.`},{ic:"\u{1F4DD}",t:"\xC9laboration du BSI (amelipro)",x:`Le BSI se remplit en ligne sur amelipro (ou via un logiciel compatible) : un questionnaire structur\xE9 d\xE9crit la situation du patient et les interventions n\xE9cessaires.

L'algorithme conventionnel classe automatiquement le patient dans l'une des 3 charges en soins (l\xE9g\xE8re, interm\xE9diaire, lourde) \u2014 ce n'est pas l'infirmier qui choisit le forfait.

L'\xE9laboration du bilan initial est r\xE9mun\xE9r\xE9e : DI 2,5, soit 25 \u20AC. Le BSI est ensuite transmis au m\xE9decin prescripteur, qui le valide (accord tacite en l'absence de r\xE9ponse).`},{ic:"\u{1F4B6}",t:"Les 3 forfaits journaliers",x:`Valeurs v\xE9rifi\xE9es en ao\xFBt 2026 :

\u2022 BSA \u2014 charge en soins L\xC9G\xC8RE : 13,00 \u20AC / jour
\u2022 BSB \u2014 charge INTERM\xC9DIAIRE : 18,20 \u20AC / jour
\u2022 BSC \u2014 charge LOURDE : 28,70 \u20AC / jour

Le forfait est factur\xE9 une seule fois par jour et par patient, quel que soit le nombre de passages effectu\xE9s dans la journ\xE9e. Il r\xE9mun\xE8re tous les soins li\xE9s \xE0 la d\xE9pendance (hygi\xE8ne, mobilisation, surveillance\u2026).`},{ic:"\u2795",t:"Cumuls avec les actes techniques",x:`\u2022 Le forfait BSI EST cumulable, le m\xEAme jour, avec les actes techniques (AMI) : pansements, injections, perfusions\u2026 La r\xE9duction de l'art. 11B s'applique entre les actes techniques, pas au forfait.
\u2022 Les frais de d\xE9placement (IFD 2,75 \u20AC et IK) se facturent selon les r\xE8gles habituelles, par d\xE9placement justifi\xE9.
\u2022 Les majorations (nuit, dimanche/f\xE9ri\xE9, MAU/MCI/MIE) suivent leurs conditions propres \u2014 en cas de doute sur un cumul pr\xE9cis, v\xE9rifier la NGAP : c'est elle qui fait foi.`},{ic:"\u{1F504}",t:"Dur\xE9e et renouvellement",x:`Le BSI est \xE9tabli pour la dur\xE9e de la prescription m\xE9dicale de prise en charge de la d\xE9pendance.

Il est r\xE9\xE9valu\xE9 et renouvel\xE9 lorsque l'\xE9tat du patient change (am\xE9lioration ou aggravation) ou \xE0 l'\xE9ch\xE9ance de la prescription, avec l'accord du prescripteur. Toute modification de la charge en soins passe par une mise \xE0 jour du BSI sur amelipro.`},{ic:"\u{1F469}\u200D\u2695\uFE0F",t:"Rempla\xE7ante : ce qui te concerne",x:`\u2022 Le BSI est \xE9tabli et mis \xE0 jour par l'infirmier(\xE8re) TITULAIRE du patient ; en remplacement, tu factures les forfaits (BSA/BSB/BSC) issus du BSI en cours de validit\xE9, sous les identifiants de facturation habituels du remplacement.
\u2022 Avant la tourn\xE9e, v\xE9rifie avec le/la titulaire : quels patients sont \xAB en BSI \xBB, quel forfait s'applique, et ce qui rel\xE8ve d'actes techniques en plus.
\u2022 Les actes techniques que tu r\xE9alises se cotent normalement en AMI, cumul\xE9s au forfait du jour.`},{ic:"\u{1F4DC}",t:"Remplacement : obligations et droits",x:`L'avenant 6 a r\xE9\xE9crit l'ensemble de la convention, dont les r\xE8gles du remplacement sous convention :

OBLIGATIONS
\u2022 Exp\xE9rience pr\xE9alable exig\xE9e pour remplacer sous convention : 18 mois (2 400 heures) de soins g\xE9n\xE9raux effectu\xE9s dans les 6 ann\xE9es pr\xE9c\xE9dentes, justifi\xE9s par attestations d'activit\xE9 (l'installation, elle, exige 24 mois / 3 200 heures).
\u2022 CONTRAT DE REMPLACEMENT \xC9CRIT obligatoire (mod\xE8le de l'Ordre), pr\xE9cisant dur\xE9e, conditions et r\xE9trocession \u2014 \xE0 conserver, l'Ordre et la CPAM peuvent le demander.
\u2022 D\xE9claration du remplacement : le remplacement est d\xE9clar\xE9 et le titulaire remplac\xE9 doit t'informer de ton obligation de respecter l'ensemble des dispositions conventionnelles (tarifs opposables, NGAP, t\xE9l\xE9transmission\u2026) \u2014 c'est \xE9crit noir sur blanc dans la convention.
\u2022 Pendant le remplacement, le titulaire remplac\xE9 s'abstient de toute activit\xE9 lib\xE9rale sur la patient\xE8le remplac\xE9e : on ne peut pas exercer \xAB \xE0 deux \xBB sur la m\xEAme tourn\xE9e au m\xEAme moment.
\u2022 Interdiction du comp\xE9rage et respect du libre choix du patient, comme tout conventionn\xE9.

DROITS
\u2022 Application des tarifs conventionnels et prise en charge des patients dans les m\xEAmes conditions que le titulaire (tiers payant, t\xE9l\xE9transmission).
\u2022 Facturation des soins r\xE9alis\xE9s pendant le remplacement, revers\xE9e selon la r\xE9trocession pr\xE9vue au contrat.
\u2022 Acc\xE8s au BSI en cours de validit\xE9 des patients (voir la partie Rempla\xE7ante).

\u26A0 Les seuils d'heures et les modalit\xE9s pr\xE9cises \xE9voluent par avenants : en cas de doute (par ex. sur ta situation d'exp\xE9rience), v\xE9rifie le texte en vigueur via le lien Convention ci-dessous ou aupr\xE8s de ta CPAM \u2014 c'est le texte qui fait foi.`},{ic:"\u{1F195}",t:"Avenant 11 (2026) : la r\xE9forme du remplacement",x:`L'avenant 11 (sign\xE9 le 31 mars 2026, publi\xE9 au JO le 6 mai 2026) r\xE9forme en profondeur le cadre du remplacement \u2014 calendrier \xE9tal\xE9 jusqu'en 2029 :

CE QUI TE CONCERNE DIRECTEMENT
\u2022 CPS PERSONNELLE : d\xE8s 2027, chaque rempla\xE7ant(e) sera identifi\xE9(e) par sa propre carte CPS sur chaque feuille de soins (fini la facturation \xAB anonyme \xBB sous la seule identit\xE9 du titulaire).
\u2022 FORMATION NGAP OBLIGATOIRE : \xE0 compter de 2027, pour tout rempla\xE7ant qui ne justifie pas d'une attestation de formation \xE9quivalente \xE0 la cotation.
\u2022 PLAFONNEMENT : \xE0 partir de 2028, l'activit\xE9 confi\xE9e aux rempla\xE7ants sera plafonn\xE9e \xE0 40 % de l'activit\xE9 du titulaire remplac\xE9 (30 % en zones surdot\xE9es ; seuil r\xE9examin\xE9 en 2029, port\xE9 \xE0 50 % dans certaines situations).

AUTRES MESURES DE L'AVENANT 11
\u2022 Revalorisation des lettres-cl\xE9s : AMI/AMX \xE0 3,35 \u20AC, puis 3,45 \u20AC au 1er novembre 2027.
\u2022 Consultations infirmi\xE8res r\xE9mun\xE9r\xE9es (20 \u20AC), statut d'infirmier r\xE9f\xE9rent (IDER), acc\xE8s direct pour certains pansements.
\u2022 D\xE9j\xE0 en vigueur depuis le 21 juin 2026 (d\xE9cision UNCAM) : actes de pansement AMI 2,02, prescriptions \xAB jusqu'\xE0 cicatrisation \xBB accept\xE9es 3 mois max, administration m\xE9dicamenteuse \xE9largie en AMI 1,2, MIE officialis\xE9e dans la NGAP, suppression de la lettre AIS.

\u26A0 Les modalit\xE9s pratiques (gestion de la CPS, logiciels, contrats) sont en cours de pr\xE9cision par la CNAM : suis les infos de ta CPAM, et adapte tes contrats de remplacement en cons\xE9quence. Le texte fait foi (page Convention en lien ci-dessous).`},{ic:"\u{1F4C5}",t:"Mise en place et rep\xE8res",x:`Le BSI s'est d\xE9ploy\xE9 progressivement : d'abord pour les patients de 90 ans et plus (2020), puis \xE9tendu par tranches d'\xE2ge jusqu'\xE0 couvrir tous les patients d\xE9pendants (2023). Aujourd'hui, toute nouvelle prise en charge de la d\xE9pendance passe par le BSI \u2014 la DSI a disparu.

Le texte complet de l'avenant 6 (et des avenants suivants qui ont ajust\xE9 les montants) est accessible depuis la page Convention en lien ci-dessous : c'est lui qui fait foi.`}].map((u,f)=>(0,o.jsxs)("div",{children:[(0,o.jsxs)("button",{className:"tap",style:{...c.backupBtn,textAlign:"left",..._===f?{borderColor:"#1173C9",color:"#0D5AA0"}:{}},onClick:()=>b(_===f?null:f),children:[u.ic," ",u.t," ",_===f?"\u25BE":"\u25B8"]}),_===f&&(0,o.jsx)("div",{style:{...c.docText,padding:"8px 4px 12px"},children:u.x})]},f))]}),(0,o.jsxs)("div",{style:c.card,children:[(0,o.jsx)("label",{style:c.emailLabel,children:"\u{1F4DA} Les 11 avenants \xE0 la convention (r\xE9sum\xE9, hors ligne)"}),(0,o.jsx)("div",{style:c.sectionHint,children:"Convention nationale des infirmiers du 22 juin 2007. R\xE9sum\xE9 v\xE9rifi\xE9 le 20 ao\xFBt 2026 sur ameli.fr et L\xE9gifrance \u2014 touche un avenant pour l'ouvrir."}),[{t:"Avenant 1 (2008) \u2014 d\xE9mographie et tarifs",x:`Sign\xE9 le 4 septembre 2008, arr\xEAt\xE9 du 17 octobre 2008 (JO du 18 octobre 2008).
\u2022 Premier dispositif de r\xE9gulation d\xE9mographique : r\xE9\xE9quilibrage de l'offre entre zones \xAB tr\xE8s sous-dot\xE9es \xBB et \xAB sur-dot\xE9es \xBB.
\u2022 Contrat sant\xE9 solidarit\xE9 avec aide forfaitaire \xE0 l'\xE9quipement.
\u2022 Revalorisation des lettres-cl\xE9s AMI, AIS, IFD et IK (effet 18 avril 2009).`},{t:"Avenant 2 (2011) \u2014 retraite (ASV)",x:`Sign\xE9 le 11 f\xE9vrier 2011, arr\xEAt\xE9 du 15 juillet 2011 (JO du 23 juillet 2011).
\u2022 Objet unique : r\xE9gime des avantages compl\xE9mentaires de vieillesse (ASV) des infirmiers lib\xE9raux.`},{t:"Avenant 3 (2011) \u2014 MAU, MCI, IFD",x:`Sign\xE9 le 28 septembre 2011, arr\xEAt\xE9 du 25 novembre 2011 (JO du 26 novembre 2011).
\u2022 Cr\xE9ation de la MAU (majoration d'acte unique) : 1,35 \u20AC pour un passage limit\xE9 \xE0 un AMI 1 ou AMI 1,5.
\u2022 Cr\xE9ation de la MCI (majoration de coordination infirmi\xE8re) : 5 \u20AC.
\u2022 IFD port\xE9e de 2,30 \u20AC \xE0 2,50 \u20AC (27 mai 2012).
\u2022 Contrat incitatif infirmier en zones tr\xE8s sous-dot\xE9es ; facilit\xE9s d'installation pour les rempla\xE7ants.`},{t:"Avenant 4 (2013-2014) \u2014 t\xE9l\xE9transmission",x:`Sign\xE9 le 19 d\xE9cembre 2013, publi\xE9 au JO le 19 mars 2014.
\u2022 Prise en charge de cotisations sociales pour l'activit\xE9 r\xE9mun\xE9r\xE9e par des structures.
\u2022 Sanctions conventionnelles en cas de non-t\xE9l\xE9transmission des feuilles de soins.
\u2022 Exp\xE9rimentation SCOR (num\xE9risation des ordonnances) et r\xE8gles de transmission des pi\xE8ces justificatives papier.`},{t:"Avenant 5 (2017-2018) \u2014 dimanche 8,50 \u20AC",x:`Sign\xE9 le 21 novembre 2017, publi\xE9 au JO le 1er mars 2018.
\u2022 Majoration dimanche et jours f\xE9ri\xE9s port\xE9e de 8 \u20AC \xE0 8,50 \u20AC (1er ao\xFBt 2018) \u2014 c'est la valeur toujours en vigueur.
\u2022 Aide aux cotisations d'allocations familiales transform\xE9e en aide forfaitaire.
\u2022 Instances paritaires r\xE9serv\xE9es aux syndicats repr\xE9sentatifs signataires ; calendrier des avenants 6 et 7.`},{t:"Avenant 6 (2019) \u2014 le BSI",x:`Sign\xE9 le 29 mars 2019, publi\xE9 au JO le 13 juin 2019 (voir la partie d\xE9taill\xE9e ci-dessus).
\u2022 Cr\xE9ation du Bilan de soins infirmiers (BSI) et des 3 forfaits journaliers BSA/BSB/BSC, en remplacement de la DSI \u2014 d\xE9ploiement progressif \xE0 partir de janvier 2020.
\u2022 Nouveaux actes : accompagnement \xE0 la prise m\xE9dicamenteuse, bilan initial de plaie, soins post-op\xE9ratoires ; revalorisation des pansements lourds et complexes.
\u2022 Majoration enfant de moins de 7 ans (MIE).
\u2022 Nouveau zonage et 3 contrats incitatifs en zones sous-dot\xE9es ; accompagnement \xE0 la t\xE9l\xE9consultation ; forfait modernisation/informatisation (FAMI).`},{t:"Avenant 7 (2019-2020) \u2014 pratique avanc\xE9e",x:`Sign\xE9 le 4 novembre 2019, publi\xE9 au JO le 3 janvier 2020.
\u2022 Int\xE9gration des infirmiers en pratique avanc\xE9e (IPA) : modalit\xE9s d'exercice et de r\xE9mun\xE9ration.
\u2022 Adaptation du dispositif d\xE9mographique ; valorisation du forfait modernisation/informatisation.`},{t:"Avenant 8 (2021-2022) \u2014 BSI pour tous",x:`Sign\xE9 le 9 novembre 2021, publi\xE9 au JO le 12 janvier 2022.
\u2022 Extension de la saisie du BSI \xE0 tous les patients d\xE9pendants, quel que soit l'\xE2ge (janvier 2022).
\u2022 Nouvelle tarification des forfaits BSI : septembre 2022 pour les 85 ans et plus, avril 2023 pour les moins de 85 ans.
\u2022 Modalit\xE9s de facturation des indemnit\xE9s kilom\xE9triques (IK) ; travaux sur la pratique avanc\xE9e et la t\xE9l\xE9sant\xE9.`},{t:"Avenant 9 (2022) \u2014 t\xE9l\xE9sant\xE9, IPA, vaccins",x:`Sign\xE9 le 27 juillet 2022, en vigueur le 23 septembre 2022.
\u2022 Actes de t\xE9l\xE9sant\xE9 (t\xE9l\xE9consultation, t\xE9l\xE9soin) pour infirmiers et IPA ; accompagnement \xE0 la t\xE9l\xE9consultation \xE9tendu \xE0 toute profession m\xE9dicale.
\u2022 Revalorisation des IPA et aides au d\xE9marrage de l'activit\xE9 lib\xE9rale IPA.
\u2022 Valorisation de l'administration des vaccins.`},{t:"Avenant 10 (2023) \u2014 IFD 2,75 \u20AC",x:`Sign\xE9 le 16 juin 2023, en vigueur le 28 juillet 2023.
\u2022 Revalorisation de 10 % des indemnit\xE9s IFD et IFI : IFD 2,50 \u20AC \u2192 2,75 \u20AC (effet 28 janvier 2024) \u2014 valeur en vigueur.
\u2022 Derni\xE8re \xE9tape du d\xE9ploiement du BSI (octobre 2023, patients de moins de 85 ans).
\u2022 Aide \xE0 la formation IPA : 15 000 \u20AC (17 000 \u20AC en DROM).`},{t:"Avenant 11 (2026) \u2014 AMI 3,35 \u20AC, remplacement, plaies",x:`Sign\xE9 le 31 mars 2026, arr\xEAt\xE9 du 5 mai 2026 (JO du 6 mai 2026), en vigueur le 6 mai 2026 ; environ 503 M\u20AC sur 2026-2029.
\u2022 AMI/AMX : 3,35 \u20AC six mois apr\xE8s la publication (d\xE9but novembre 2026), puis 3,45 \u20AC au 1er novembre 2027. Au 20 ao\xFBt 2026, l'AMI reste \xE0 3,15 \u20AC.
\u2022 Nomenclature d\xE9j\xE0 en vigueur depuis le 21 juin 2026 (d\xE9cision UNCAM du 2 juin 2026) : pansements AMI 2,02 (plaie non chirurgicale / plaie chirurgicale simple), administration m\xE9dicamenteuse \xE9largie AMI 1,2, MIE inscrite dans la NGAP, lettre AIS supprim\xE9e, ordonnance \xAB jusqu'\xE0 cicatrisation \xBB accept\xE9e 3 mois maximum.
\u2022 Plaies : acc\xE8s direct aux plaies non chirurgicales \xE0 partir du 1er janvier 2027 ; bilan annuel de plaie AMI 3,48.
\u2022 Consultations infirmi\xE8res \xE0 20 \u20AC : CIA (initiation \xE0 l'insuline, diab\xE8te de type 2) et CIB (suivi post-bilan de pr\xE9vention, 1er juillet 2027) ; infirmier r\xE9f\xE9rent.
\u2022 Soins non programm\xE9s : astreinte PDSA 52 \u20AC/4 h, majoration MIR 15 \u20AC, acte \xAB lev\xE9e de doute \xBB AMI 1,35.
\u2022 BSI : BSA 13 \u20AC, BSB 18,20 \u20AC, BSC 28,70 \u20AC maintenus ; majoration MSG +3,10 \u20AC sur le BSC au 1er janvier 2028 ; nouveaux actes de surveillance au 1er janvier 2028.
\u2022 IPA : consultation 16 \u2192 21 \u20AC, suivi initial 70 \u20AC, suivi 50 \u20AC ; programme \xC9quilibres (54 \u20AC/h).
\u2022 Remplacement : CPS personnelle du rempla\xE7ant (2027), formation NGAP obligatoire (2027), plafonnement de l'activit\xE9 remplac\xE9e (2028) \u2014 d\xE9tail dans la partie Avenant 6 ci-dessus.`}].map((u,f)=>(0,o.jsxs)("div",{children:[(0,o.jsxs)("button",{className:"tap",style:{...c.backupBtn,textAlign:"left",...Vi===f?{borderColor:"#1173C9",color:"#0D5AA0"}:{}},onClick:()=>vb(Vi===f?null:f),children:[u.t," ",Vi===f?"\u25BE":"\u25B8"]}),Vi===f&&(0,o.jsx)("div",{style:{...c.docText,padding:"8px 4px 12px"},children:u.x})]},f)),(0,o.jsx)("div",{style:c.sectionHint,children:"Sources : ameli.fr (page \xAB Avenants \xBB de la convention), L\xE9gifrance (arr\xEAt\xE9 du 5 mai 2026 et d\xE9cision UNCAM du 2 juin 2026). Le texte publi\xE9 fait foi."})]}),(0,o.jsxs)("div",{style:c.card,children:[(0,o.jsx)("label",{style:c.emailLabel,children:"\u2696\uFE0F Code de d\xE9ontologie \u2014 articles cl\xE9s (int\xE9gr\xE9, hors ligne)"}),(0,o.jsx)("div",{style:c.docText,children:`Art. R.4312-3 \u2014 L'infirmier, au service de la personne et de la sant\xE9 publique, exerce sa mission dans le respect de la vie humaine. Il respecte la dignit\xE9 et l'intimit\xE9 du patient, de sa famille et de ses proches. Le respect d\xFB \xE0 la personne continue de s'imposer apr\xE8s la mort.

Art. R.4312-4 \u2014 L'infirmier respecte en toutes circonstances les principes de moralit\xE9, de probit\xE9, de loyaut\xE9 et d'humanit\xE9 indispensables \xE0 l'exercice de la profession.

Art. R.4312-5 \u2014 Le secret professionnel s'impose \xE0 tout infirmier, dans les conditions \xE9tablies par la loi. L'infirmier instruit les personnes qui l'assistent de leurs obligations en mati\xE8re de secret professionnel.

Art. R.4312-6 \u2014 L'infirmier ne peut ali\xE9ner son ind\xE9pendance professionnelle sous quelque forme que ce soit.

Art. R.4312-7 \u2014 L'infirmier en pr\xE9sence d'un malade ou d'un bless\xE9 en p\xE9ril, ou inform\xE9 qu'un malade ou un bless\xE9 est en p\xE9ril, lui porte assistance, ou s'assure qu'il re\xE7oit les soins n\xE9cessaires.

Art. R.4312-12 (continuit\xE9 des soins) \u2014 D\xE8s lors qu'il a accept\xE9 d'effectuer des soins, l'infirmier est tenu d'en assurer la continuit\xE9. Hors le cas d'urgence et celui o\xF9 il manquerait \xE0 ses devoirs d'humanit\xE9, un infirmier a le droit de refuser ses soins pour une raison professionnelle ou personnelle. S'il se trouve dans l'obligation d'interrompre ou d\xE9cide de ne pas effectuer des soins, il doit, sous r\xE9serve de ne pas nuire au patient, lui en expliquer les raisons, l'orienter vers un confr\xE8re ou une structure adapt\xE9e et transmettre les informations utiles \xE0 la poursuite des soins.

Art. R.4312-13 (information) \u2014 L'infirmier met en \u0153uvre le droit de toute personne d'\xEAtre inform\xE9e sur son \xE9tat de sant\xE9, dans le respect de ses comp\xE9tences. L'information donn\xE9e est loyale, adapt\xE9e et intelligible ; seules l'urgence ou l'impossibilit\xE9 peuvent l'en dispenser.

Art. R.4312-14 (consentement) \u2014 Le consentement libre et \xE9clair\xE9 de la personne examin\xE9e ou soign\xE9e est recherch\xE9 dans tous les cas. Lorsque le patient, en \xE9tat d'exprimer sa volont\xE9, refuse le traitement propos\xE9, l'infirmier respecte ce refus apr\xE8s l'avoir inform\xE9 de ses cons\xE9quences et, avec son accord, le m\xE9decin prescripteur.

Art. R.4312-19 (douleur) \u2014 En toutes circonstances, l'infirmier s'efforce, par son action professionnelle, de soulager les souffrances du patient par des moyens appropri\xE9s \xE0 son \xE9tat et l'accompagne moralement.

  * { box-sizing: border-box; }
  html {
    background: #DDECF2;
  }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse 78% 38% at 8% -4%, rgba(15, 101, 214, .30), transparent 68%),
      radial-gradient(ellipse 68% 34% at 101% 7%, rgba(0, 189, 176, .26), transparent 66%),
      radial-gradient(ellipse 78% 42% at -18% 48%, rgba(15, 145, 198, .17), transparent 70%),
      radial-gradient(ellipse 70% 38% at 112% 62%, rgba(30, 193, 130, .20), transparent 68%),
      radial-gradient(ellipse 82% 42% at 18% 104%, rgba(31, 105, 196, .19), transparent 70%),
      linear-gradient(165deg, #E8F2FA 0%, #DDF2F0 42%, #E5F3EE 72%, #E4EDF8 100%);
    background-attachment: fixed;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .36;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,.76) 0 1px, transparent 1.6px),
      radial-gradient(circle at 75% 35%, rgba(255,255,255,.58) 0 1px, transparent 1.5px);
    background-size: 34px 34px, 46px 46px;
    mask-image: linear-gradient(to bottom, rgba(0,0,0,.65), transparent 72%);
  }
  button, input, textarea, select { -webkit-appearance: none; appearance: none; }
  input[type=checkbox] { -webkit-appearance: auto; appearance: auto; accent-color: #0C8F7A; }
  .tap {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .10s ease, box-shadow .18s ease, filter .18s ease, background .18s ease;
  }
  .tap:hover { filter: brightness(1.015); }
  .tap:active { transform: scale(.975); }
  button:disabled { opacity: .32; }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: #168ECA !important;
    box-shadow: 0 0 0 4px rgba(17,115,201,.11) !important;
  }
  ::placeholder { color: #93A4AA; opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .tap { transition: none; } }
